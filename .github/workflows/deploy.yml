name: Deploy Astro site to Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install D2
        shell: bash
        run: |
          set -euo pipefail
          D2_VERSION="0.9.0"
          D2_SHA256="5669ddc46b99e942cc96078f4a4e36d5e62103348f4c05179ede27802fdd87a9"
          curl -fsSL -o /tmp/d2.tar.gz "https://github.com/d2lang/d2/releases/download/v${D2_VERSION}/d2-v${D2_VERSION}-linux-amd64.tar.gz"
          echo "${D2_SHA256}  /tmp/d2.tar.gz" | sha256sum -c -
          mkdir -p /tmp/d2
          tar -xzf /tmp/d2.tar.gz -C /tmp/d2
          D2_BIN="$(find /tmp/d2 -type f -name d2 | head -n 1)"
          test -n "$D2_BIN"
          sudo install -m 0755 "$D2_BIN" /usr/local/bin/d2
          d2 --version

      - name: Render D2 diagrams
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/diagrams/d2
          for source in diagrams/d2/*.d2; do
            name="$(basename "$source" .d2)"
            d2 --layout=elk "$source" "public/diagrams/d2/${name}.svg"
          done

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Verify discovery outputs
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/llms.txt
          test -s dist/llms-small.txt
          test -s dist/llms-full.txt
          test -s dist/tags/index.html
          test -s dist/kb/agentcore-ai-platform/harness-governed-workflow.md

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
