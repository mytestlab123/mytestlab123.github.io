<text x="432" y="335.75" fill="#172033" font-family="Arial, DejaVu Sans, sans-serif" font-size="17" font-weight="700"><tspan x="432" dy="0">AWS Compliance Agent</tspan><tspan x="432" dy="21.25">read · explain · plan</tspan></text>
<text x="432" y="556" fill="#172033" font-family="Arial, DejaVu Sans, sans-serif" font-size="16" font-weight="700"><tspan x="432" dy="0">Server-owned planner</tspan><tspan x="432" dy="20">retained manifests + exact scope</tspan></text>
<text x="872" y="295.75" fill="#172033" font-family="Arial, DejaVu Sans, sans-serif" font-size="17" font-weight="700"><tspan x="872" dy="0">Human Approve / Reject</tspan><tspan x="872" dy="21.25">exact approved intent</tspan></text>
<text x="872" y="460.75" fill="#172033" font-family="Arial, DejaVu Sans, sans-serif" font-size="17" font-weight="700"><tspan x="872" dy="0">AgentCore Gateway</tspan><tspan x="872" dy="21.25">bounded tool entry point</tspan></text>
<text x="872" y="625.75" fill="#172033" font-family="Arial, DejaVu Sans, sans-serif" font-size="17" font-weight="700"><tspan x="872" dy="0">AgentCore Policy</tspan><tspan x="872" dy="21.25">ALLOW / DENY</tspan></text>
<text x="1317" y="380.75" fill="#172033" font-family="Arial, DejaVu Sans, sans-serif" font-size="17" font-weight="700"><tspan x="1317" dy="0">Exact family tool</tspan><tspan x="1317" dy="21.25">narrow mutation only</tspan></text>
<text x="1317" y="585.75" fill="#172033" font-family="Arial, DejaVu Sans, sans-serif" font-size="17" font-weight="700"><tspan x="1317" dy="0">AWS API</tspan><tspan x="1317" dy="21.25">approved change</tspan></text>
<text x="1632" y="446" fill="#172033" font-family="Arial, DejaVu Sans, sans-serif" font-size="16" font-weight="700"><tspan x="1632" dy="0">Direct provider</tspan><tspan x="1632" dy="20">readback</tspan><tspan x="1632" dy="20">actual state decides</tspan><tspan x="1632" dy="20">success</tspan></text>
<text x="382.5" y="258.875" fill="#E8790C" font-family="Arial, DejaVu Sans, sans-serif" font-size="13" font-weight="700" text-anchor="middle">compliance evidence</text>
<text x="580" y="438.875" fill="#6D28D9" font-family="Arial, DejaVu Sans, sans-serif" font-size="13" font-weight="700" text-anchor="middle">read / explain / plan</text>
<text x="772.5" y="415.75" fill="#6D28D9" font-family="Arial, DejaVu Sans, sans-serif" font-size="13" font-weight="700" text-anchor="middle"><tspan x="772.5" dy="0">exact family +</tspan><tspan x="772.5" dy="16.25">immutable batch</tspan></text>
<text x="1027.5" y="383.875" fill="#2563EB" font-family="Arial, DejaVu Sans, sans-serif" font-size="13" font-weight="700" text-anchor="middle">approved exact intent</text>
<text x="1025" y="548.875" fill="#2563EB" font-family="Arial, DejaVu Sans, sans-serif" font-size="13" font-weight="700" text-anchor="middle">bounded invocation</text>
<text x="1252.5" y="558.875" fill="#2563EB" font-family="Arial, DejaVu Sans, sans-serif" font-size="13" font-weight="700" text-anchor="middle">ALLOW only</text>
<text x="1420.5" y="473.875" fill="#E8790C" font-family="Arial, DejaVu Sans, sans-serif" font-size="13" font-weight="700" text-anchor="middle">narrow AWS action</text>
<text x="1512.5" y="693.875" fill="#E8790C" font-family="Arial, DejaVu Sans, sans-serif" font-size="13" font-weight="700" text-anchor="middle">verify actual state</text>
<text x="70" y="217.75" fill="#334155" font-family="Arial, DejaVu Sans, sans-serif" font-size="18" font-weight="700">1 Detect</text>
<text x="400" y="217.75" fill="#334155" font-family="Arial, DejaVu Sans, sans-serif" font-size="18" font-weight="700">2 Reason &amp; Scope</text>
<text x="840" y="217.75" fill="#334155" font-family="Arial, DejaVu Sans, sans-serif" font-size="18" font-weight="700">3 Govern</text>
<text x="1290" y="217.75" fill="#334155" font-family="Arial, DejaVu Sans, sans-serif" font-size="18" font-weight="700">4 Execute</text>
<text x="1620" y="217.75" fill="#334155" font-family="Arial, DejaVu Sans, sans-serif" font-size="18" font-weight="700">5 Verify</text>
<text x="960" y="903" fill="#334155" font-family="Arial, DejaVu Sans, sans-serif" font-size="18" text-anchor="middle"><tspan x="960" dy="0">Reasoning, authorization, execution, and verification remain separate responsibilities. A model recommendation is never treated as AWS</tspan><tspan x="960" dy="22.5">authorization or proof of success.</tspan></text>
<text x="960" y="55.25" fill="#172033" font-family="Arial, DejaVu Sans, sans-serif" font-size="30" font-weight="700" text-anchor="middle">AWS Compliance Agent — Governed Remediation Flow</text>
<text x="960" y="86" fill="#475569" font-family="Arial, DejaVu Sans, sans-serif" font-size="16" text-anchor="middle">Detection, reasoning, human approval, policy enforcement, narrow execution, and provider verification</text>
<text x="70" y="1057.5" fill="#64748B" font-family="Arial, DejaVu Sans, sans-serif" font-size="12">Public portfolio view · sanitized · source implementation remains authoritative in the aws-secops repository</text>
</svg>
